<!doctype html>
<html>
<head>
    <title>Doc Q&A</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        input, button { margin: 5px; padding: 8px; }
        .section { margin-top: 30px; }
        pre { background: #eef5ff; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Upload Document</h2>
    <form id="uploadForm" enctype="multipart/form-data">
        <input type="file" name="file">
        <button type="submit">Upload & Index</button>
    </form>
    <p id="uploadMessage"></p>

    <div class="section">
        <h2>Ask Question</h2>
        <form id="qaForm">
            <input type="text" id="question" placeholder="Your question" size="50">
            <button type="submit">Ask</button>
        </form>
        <pre id="answer"></pre>
    </div>

    <script>
        document.getElementById("uploadForm").onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const res = await fetch("/index", {
                method: "POST",
                body: formData
            });
            const result = await res.json();
            document.getElementById("uploadMessage").innerText = result.message || result.error;
        };

        document.getElementById("qaForm").onsubmit = async (e) => {
            e.preventDefault();
            const question = document.getElementById("question").value;
            const res = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question })
            });
            const data = await res.json();
            document.getElementById("answer").innerText = "Q: " + question + "\nA: " + data.answer;
        };
    </script>
</body>
</html>
